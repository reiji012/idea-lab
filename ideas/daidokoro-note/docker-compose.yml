services:
  # フロントエンド (Next.js) - 開発モード
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.dev
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_OCR_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - ocr-backend

  # OCRバックエンド (FastAPI + PaddleOCR) - GPU対応
  ocr-backend:
    build:
      context: ./ocr-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_TOKEN=${API_TOKEN:-dev-token}
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - ocr-data:/app/data
      - ./ocr-backend/app:/app/app # ホットリロード用
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: [ "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload" ]

volumes:
  ocr-data:
